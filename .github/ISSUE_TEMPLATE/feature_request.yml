name: Feature Request
description: Suggest an idea or capability enhancement for Amvelt TRACE
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Pain Point
      description: Is your feature request related to a problem? Please describe clearly.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
